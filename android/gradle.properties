# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false

# ---------------------------------------------------------------------------
# Android Lint: use the K1 UAST frontend, not K2.
#
# THIS DISABLES NO LINT CHECK. It selects which Kotlin frontend lint resolves
# source with. Every issue that was enabled stays enabled, on every module,
# including this application's own Kotlin. It is not a baseline and it
# suppresses no finding.
#
# WHY. The first run of the lint gate crashed before it could report
# anything. The failure was not in this application:
#
#   > Task :react-native-worklets:lintAnalyzeDebug FAILED
#   Execution failed for task ':react-native-worklets:lintAnalyzeDebug'.
#   > A failure occurred while executing AndroidLintWorkAction
#      > Unexpected failure during lint analysis (this is a bug in lint or
#        one of the libraries it depends on)
#        Message: Cannot find a KaModule for the VirtualFile
#
# The stack names the exact path:
#
#   LintDriver.checkBuildScripts -> UastGradleVisitor.visitBuildScript
#     -> KotlinUFile.getClasses -> toLightClass
#     -> KotlinAsJavaSupportBase.getLightClassForScript
#     -> SymbolKotlinAsJavaSupport.createInstanceOfLightScript
#     -> KotlinStandaloneProjectStructureProvider.getModule  <-- throws
#
# SymbolKotlinAsJavaSupport and KotlinStandaloneProjectStructureProvider are
# the Kotlin Analysis API (K2) implementation, so this is the K2 frontend
# failing to associate a *Kotlin build script* with any module. The build
# script in question is a vendored dependency's:
#
#   node_modules/react-native-worklets/android/build.gradle.kts
#
# node_modules/react-native-reanimated/android/build.gradle.kts is the only
# other .kts in the whole build; this application's own Gradle scripts are
# Groovy, which this code path never touches.
#
# WHY IT CANNOT BE FIXED CLOSER TO THE CAUSE.
#  - The file belongs to a vendored package. It is not under version control
#    here and npm ci rewrites it, so editing it repairs nothing.
#  - The library's own `lint { abortOnError = false }` does not help: this is
#    a crash in lintAnalyze, not an error-severity finding in a lint report.
#  - It is not reachable from :app configuration either. checkDependencies
#    defaults to false (AGP 8.12 DSL reference) and this project never sets
#    it, yet AGP still runs lintAnalyze<Variant> for local library
#    subprojects to produce the partial results the app's report merges -
#    which is exactly what run 225 shows happening.
#
# So the narrowest lever that keeps every check on every module is the
# frontend itself.
#
# THIS IS A TEMPORARY COMPATIBILITY WORKAROUND, NOT A SETTING.
#
# It is a stated liability: K1 UAST is the frontend AGP is migrating away
# from, and it will eventually stop being an option. Leaving this line in
# place after the upstream bug is fixed means linting this application's
# Kotlin with a frontend nobody tests any more.
#
# REMOVAL CHECK - mechanical, no judgement required:
#
#   1. Delete this line.
#   2. Run  cd android && ./gradlew :app:lintDebug --no-daemon --console=plain
#      (or dispatch the Android Validation workflow, whose
#      scripts/ci/verify-android-lint.sh does the same and prints the
#      findings).
#   3. If :react-native-worklets:lintAnalyzeDebug completes, the workaround
#      is dead and the deletion stands. If it fails again with
#      "Cannot find a KaModule for the VirtualFile", restore this line and
#      leave this note alone.
#
# There is no version number here on purpose. The fix has to land in the
# lint that the AGP in android/build.gradle actually bundles, and this
# environment cannot reach maven.google.com or the upstream tracker to
# confirm which release that is - so the honest trigger is the check
# above, run after any AGP upgrade, rather than a version guess.
#
# WHAT WOULD ALSO RETIRE IT: the trigger is a dependency's Kotlin DSL
# build script. Today those are
# node_modules/react-native-worklets/android/build.gradle.kts and
# node_modules/react-native-reanimated/android/build.gradle.kts. If both
# dependencies are ever removed or ship Groovy build files, run the check
# above as well - the crash may simply have nothing left to trip over.
android.lint.useK2Uast=false
