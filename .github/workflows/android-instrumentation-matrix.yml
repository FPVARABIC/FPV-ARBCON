name: Android Instrumentation Matrix

# THE WIDE API SWEEP.
#
# android-validation.yml runs ONE mandatory emulator job on API 34 for every
# validation. This workflow is the rest of the sweep, kept separate for one
# reason only: cost. Four emulator jobs on every commit would add roughly an
# hour of runner time to a workflow that already takes over an hour, and the
# mandatory job is what has to stay fast enough to be run constantly.
#
# The levels are chosen mechanically from the application's own declaration
# in android/build.gradle - minSdkVersion 24, targetSdkVersion 36:
#
#   24  the LOWEST level the app claims to support. If the app cannot run
#       here, either it is broken on the oldest supported device or minSdk
#       is a false claim. Both are findings, and neither may be hidden by
#       quietly deleting this entry.
#   30  a representative middle level, still very widely installed.
#   34  the level the mandatory job uses, repeated here so the matrix is a
#       superset and a divergence between the two is visible.
#   36  the DECLARED TARGET. Behaviour changes are opt-in by targetSdk, so
#       this is the level whose new restrictions actually apply to the app.
#
# fail-fast is false on purpose: one failing level must not hide the result
# of the others. No continue-on-error and no retry anywhere - a failure here
# is a result, not something to paper over.

on:
  workflow_dispatch:
    inputs:
      api_levels:
        description: >-
          Optional JSON array to narrow the sweep, e.g. "[24]". Leave blank
          to run the full declared range.
        type: string
        default: ''

concurrency:
  group: android-instrumentation-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: Instrumentation API ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # include: entries rather than a bare api-level list, because the
        # rows differ in more than their API level now - the 16 KB row
        # needs its own system-image tag and its own hard expectation.
        include:
          - api-level: 24
            target: google_apis
            label: 24 - minSdkVersion
          - api-level: 30
            target: google_apis
            label: 30 - representative middle
          - api-level: 34
            target: google_apis
            label: 34 - same level as the mandatory job
          - api-level: 36
            target: google_apis
            label: 36 - declared targetSdkVersion
          # THE 16 KB PAGE ROW.
          #
          # Everything else here runs on a 4 KB image, so no other row is
          # evidence about a 16 KB device however green it is. Android's
          # guide names the image - "Google APIs Experimental 16 KB Page
          # Size Intel x86_64 Atom System Image", which is the
          # google_apis_experimental tag - and names the check:
          #
          #   "run the following command to verify that it's using a 16 KB
          #    environment: adb shell getconf PAGE_SIZE. The command
          #    should return a value of 16384."
          #
          # expected-page-size makes that a requirement rather than a
          # note: the run fails if the image turns out to be a 4 KB one,
          # so this row cannot report success for a property it did not
          # test. The system image is not reachable from the environment
          # this workflow was written in (dl.google.com is blocked there),
          # so whether the tag resolves on a runner is decided by running
          # it - which is why this workflow is dispatch-only.
          - api-level: 35
            target: google_apis_experimental
            label: 35 - 16 KB page size
            expected-page-size: 16384
    steps:
      - name: Skip levels not requested
        id: gate
        shell: bash
        run: |
          requested='${{ inputs.api_levels }}'
          if [ -z "$requested" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif echo "$requested" | grep -q "\b${{ matrix.api-level }}\b"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "API ${{ matrix.api-level }} not in $requested - skipping"
          fi

      - name: Checkout
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@v7

      # The NDK stays. This job builds the release APK, which compiles
      # Skia, Reanimated and Worklets from C++ against
      # ndk/27.1.12297006; removing it fails the build for a reason that
      # has nothing to do with the API level under test.
      - name: Free runner disk space
        if: ${{ steps.gate.outputs.run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          codeql_path="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          for path in /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /opt/az /usr/local/share/powershell /usr/local/share/chromium \
                      "$codeql_path"; do
            if [ -e "$path" ]; then
              echo "  Removing: $path"
              sudo rm -rf -- "$path"
            else
              echo "  Not present: $path"
            fi
          done
          echo "Disk after cleanup:"
          df -h /

      - name: Setup Node
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: npm ci

      - name: Setup JDK 17 (Temurin)
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: chmod +x ./gradlew
        working-directory: android

      - name: Enable KVM for the runner user
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Same immutable commit pin as android-validation.yml. See the
      # supply-chain note there for how a421e438... was resolved (the
      # PEELED commit of v2.38.0, not the annotated tag object) and for the
      # two traps that made an earlier pin here point at v2.9.0.
      # Built ahead of the emulator for the same reason as the mandatory
      # job: a compile failure and a test failure are different findings.
      - name: Build the release APK and the androidTest APK
        if: ${{ steps.gate.outputs.run == 'true' }}
        working-directory: android
        timeout-minutes: 60
        run: |
          ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest \
            -PreactNativeArchitectures=x86_64 \
            --max-workers=2 \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Instrumentation tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        # Empty for every 4 KB row, which leaves the page size reported and
        # not asserted. On the 16 KB row it is 16384, and the script exits
        # non-zero if the emulator disagrees.
        env:
          EXPECT_PAGE_SIZE: ${{ matrix.expected-page-size }}
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          # The same file the mandatory job runs, for the same reason: the
          # action executes this input with dash, so anything written
          # inline has to be dash-clean, and an inline block cannot be
          # rehearsed locally. Running the identical file across API
          # levels also means a difference between two rows is a platform
          # difference and not a difference between two copies of a
          # script. See scripts/ci/run-instrumentation-on-emulator.sh.
          script: ../scripts/ci/run-instrumentation-on-emulator.sh

      - name: Verify instrumentation results
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: |
          scripts/ci/verify-instrumentation-results.sh \
            android/app/build/outputs/androidTest-results/connected \
            instrumentation-diagnostics/logcat.txt

      - name: Upload instrumentation results and diagnostics
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-instrumentation-api-${{ matrix.api-level }}-${{ matrix.target }}
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
            instrumentation-diagnostics/**
          if-no-files-found: warn
          retention-days: 14
