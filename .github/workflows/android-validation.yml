name: Android Validation

# Mandatory quality gate for native (Android/Kotlin) passes.
# Proves the repository's own Gradle wrapper actually compiles and tests the
# Pass 1-4 USB serial transport code. Must stay green before any future
# native pass (Pass 5+) is planned or implemented.
#
# Also builds a standalone release APK (signed with the repo's existing,
# non-secret debug keystore - internal validation signing only, not a
# production release) so it can be installed and launched on real hardware
# without a Metro server. The debug variant is still built and exercised
# internally (compileDebugKotlin/testDebugUnitTest/assembleDebug all run
# against it).
#
# Pass 7.6c: the debug APK is NOW ALSO uploaded, as the clearly-separated
# fpv-arbcon-apk-debug artifact. Rationale: the bounded [FPV-BATT]/
# [FPV-TELEM] hardware observability (batteryDebugLog.ts /
# auxTelemetryDebugLog.ts) is deliberately __DEV__-only, so the standalone
# release APK cannot emit it - capturing those logs on real hardware
# requires the debug variant. LIMITATION, disclosed rather than hidden:
# this debug APK does NOT bundle the JS - it needs a Metro server on the
# connected computer (npx react-native start + adb reverse tcp:8081
# tcp:8081). The standalone fpv-arbcon-apk release artifact remains the
# primary hardware-validation download.

on:
  workflow_dispatch:
    inputs:
      diagnostic_js_only:
        description: >-
          Diagnostic only: run Checkout -> Jest (with the open-handle
          reporter) and skip every Android/Gradle step. Produces NO APKs.
        type: boolean
        default: false
      api_matrix:
        description: >-
          Also run the API 24 / 36 / 35-16KB emulator matrix. Off by
          default because it adds roughly two hours of runner time; the
          API 34 job above is the reference run that goes with every
          validation.
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/platforms/react-native/**'
      - 'src/core/**'
      - 'src/ui/**'
      - 'src/i18n/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'index.js'
      - '*.config.js'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/android-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/platforms/react-native/**'
      - 'src/core/**'
      - 'src/ui/**'
      - 'src/i18n/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'index.js'
      - '*.config.js'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/android-validation.yml'

env:
  # ONE definition of the shard count. The matrix indices below must run
  # 1..JEST_SHARD_COUNT; verifyJestShards.js fails the build if they ever
  # drift apart and a test file is left unrun.
  JEST_SHARD_COUNT: 4

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates run ONCE for the whole workflow rather than once per
  # shard: they are not per-shard work, and repeating them would spend
  # four runners to learn the same fact four times.
  static-validation:
    name: Static validation (TypeScript + ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: TypeScript check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      - name: ESLint
        run: npx eslint .

      # Proves the shard partition is lossless on this runner, with this
      # Jest, before the matrix is allowed to stand in for the unsharded
      # suite. Fails the workflow if any test file is claimed by no shard
      # or by more than one.
      - name: Jest shard completeness (union == universe)
        run: node scripts/ci-diagnostics/verifyJestShards.js "${{ env.JEST_SHARD_COUNT }}"

  jest:
    # The divisor is spelled out here because GitHub does not expose the
    # `env` context in a JOB name (only in step names, `run` and `with`).
    # It is cosmetic: the correctness-bearing link between the matrix and
    # JEST_SHARD_COUNT is enforced by the completeness gate above, which
    # fails the build if they ever disagree and a test file goes unrun.
    name: Jest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports its own verdict: one red shard must not hide
      # the state of the other three.
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # WHY THIS IS A MATRIX AND NOT ONE STEP.
      #
      # The monolithic Jest step stopped fitting its wall-clock budget on
      # the hosted runners, and a paired control proved the cause was the
      # runners rather than any commit: e91ddb15 - the very commit that had
      # passed this step in 415s that morning - also timed out at 612s on
      # the same pool that afternoon, as did its child, both with ZERO Jest
      # FAIL lines and no OOM, SIGKILL or open handle. Raising 10 -> 20
      # minutes was not enough either (1212s, twice).
      #
      # So the suite is SPLIT, NOT SHORTENED. `--shard=i/N` is Jest's own
      # partitioner: the shards are disjoint and their union is the whole
      # universe, which verifyJestShards.js re-proves ON THE RUNNER before
      # any shard is trusted. Nothing is excluded, no per-test timeout is
      # moved, no retry or continue-on-error is added - a failing test
      # still fails its shard, and a failing shard still fails this job and
      # blocks the Android build.
      #
      # FOUR shards, measured rather than guessed. Locally, idle, the whole
      # suite is 366s; four shards are 62/144/99/52s and six are
      # 42/47/140/74/59/21s - the critical path barely moves (144s -> 140s)
      # because one heavy group of files cannot be split further, so six
      # runners would buy 3% for 50% more machines.

      # BOUNDED ON PURPOSE. Run 30491403562 finished all 95 suites / 2559
      # tests green in 41.6 seconds, then printed "Jest did not exit one
      # second after the test run has completed" and sat on the runner for
      # 60 more minutes until it was cancelled by hand. Nothing failed and
      # nothing was running - an unclosed async handle simply kept the
      # process alive, and the 6-hour job default let it.
      #
      # 10 minutes is ~14x the observed runtime, so it cannot trip on a
      # slow runner, but a hang now fails in minutes with Jest's own
      # open-handle hint already in the log.
      #
      # This is a BOUND, NOT A FIX, and it is deliberately not --forceExit:
      # forcing the process to die would hide "something is still running
      # after teardown" in the one suite that drives the real motor
      # controller, which is the last place to accept that.
      # WHY --detectOpenHandles IS NOT USED HERE, having been tried.
      #
      # Run 30496148622 ran this step as `npx jest --ci --detectOpenHandles`
      # and it PASSED in 48 seconds on the same tree that hung for 60
      # minutes in run 30491403562. The flag implies --runInBand, and
      # in-band is exactly what suppresses the hang: the leaked handle lives
      # in a Jest WORKER, and it is the main process waiting on a worker
      # that never exits which produces the stall. Running everything in one
      # process removes the worker, and with it the symptom.
      #
      # So the one flag that can name a handle also hides this handle.
      # Diagnosis had to come from reading the teardown path instead - see
      # the OPEN_HARNESSES/afterEach note in
      # src/ui/screens/motorPayloadIndexIdentity.test.tsx - and
      # confirmation has to come from a normal, worker-topology run like
      # this one.
      #
      # THE DIAGNOSTIC BRANCH BELOW CHANGES NOTHING FOR A NORMAL RUN. With
      # diagnostic_js_only unset - every push, and every dispatch that does
      # not tick the box - this step is still exactly `npx jest --ci`, same
      # worker topology, same command, no reporter loaded.
      #
      # The diagnostic branch pins --maxWorkers=1 on purpose. Measured, not
      # assumed: locally 4 CPUs give Jest a default of 3 workers and the
      # hang almost never appears; one worker makes Jest run in-band, which
      # is what a 2-CPU runner does by default anyway, and is the only
      # topology in which the leaked handle sits in the process that has to
      # exit. Pinning it removes the CPU count as a variable.
      # HEAP CEILING, RAISED ON EVIDENCE - not to make a red run green.
      #
      # Run #135 died here with "Ineffective mark-compacts near heap limit",
      # the main process aborting at ~1.92 GB, which is Node's default
      # old-space limit. The suspicion was that the commit under test had
      # leaked memory, so it was measured rather than assumed - peak heap
      # across the whole suite, same command, same machine:
      #
      #   6edfe35  (run #134, PASSED)  3284 MB
      #   d0cf7d1  (run #135, OOM)     3065 MB
      #
      # The passing commit peaked HIGHER. The suite has simply been running
      # against the default ceiling for some time and which side of it a run
      # lands on is marginal, so #134 passing was luck rather than headroom.
      # A GitHub runner has 16 GB; 6 GB gives the suite real room while
      # still failing loudly on a genuine runaway leak instead of swallowing
      # one.
      # THE WHOLE-SUITE WALL-CLOCK GUARD, not a test budget. It exists to
      # stop a hung or runaway run, and nothing about per-test timeouts or
      # assertions changes with it: jest.config.js keeps testTimeout 30000,
      # every suite still runs, and no retry or --forceExit is involved.
      #
      # RAISED BECAUSE THE OLD BUDGET WAS EXHAUSTED BY THE RUNNERS, NOT BY
      # THE SUITE. Measured with a paired control on the same day and the
      # same hosted-runner pool, both runs stopped by this timeout with ZERO
      # Jest FAIL lines and no OOM, SIGKILL or open-handle report:
      #
      #   e91ddb15  run 34071305457 attempt 3   Jest 612s  TIMED OUT
      #   34bf8200  run 34124815112 attempt 1   Jest 612s  TIMED OUT
      #
      # e91ddb15 is the commit that passed this same step in 415s earlier
      # the same day (run 34071305457 attempt 1). On the newer runners its
      # npm ci / tsc / eslint steps are 20-50% slower too, so the baseline
      # itself no longer fits 10 minutes. 20 minutes restores the headroom
      # 415s once had without weakening a single assertion.
      - name: Jest shard ${{ matrix.shard }}/${{ env.JEST_SHARD_COUNT }}
        timeout-minutes: 20
        env:
          JEST_LEAK_OUT: ${{ github.workspace }}/jest-open-handles.txt
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          if [ "${{ inputs.diagnostic_js_only }}" = "true" ]; then
            echo "DIAGNOSTIC RUN: open-handle reporter attached, one worker, no Android steps."
            npx jest --ci --maxWorkers=1 \
              --shard=${{ matrix.shard }}/${{ env.JEST_SHARD_COUNT }} \
              --reporters=default \
              --reporters=./scripts/ci-diagnostics/jestLeakReporter.js
          else
            npx jest --ci --shard=${{ matrix.shard }}/${{ env.JEST_SHARD_COUNT }}
          fi

      # always(), so it survives the Jest step being killed by its own
      # timeout - which is the EXPECTED outcome of a diagnostic run that
      # reproduces the hang. The reporter also prints to the log, so the
      # evidence exists even if this upload finds nothing.
      - name: Upload Jest open-handle report (diagnostic runs only)
        if: ${{ always() && format('{0}', inputs.diagnostic_js_only) == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-jest-open-handles-shard-${{ matrix.shard }}
          path: jest-open-handles.txt
          if-no-files-found: warn
          retention-days: 14


  # =====================================================================
  # REAL INSTRUMENTATION, ON A REAL ANDROID RUNTIME.
  #
  # Until UI-X3 this repository had ZERO androidTest sources, so nothing
  # ever executed the Activity lifecycle, the merged manifest or the
  # installed release package. Jest cannot reach any of it:
  # react-test-renderer has no Activity, no configuration change, no
  # package manager and no process.
  #
  # WHY API 34 IS THE MANDATORY LEVEL. The application declares
  # minSdk 24 / targetSdk 36 (android/build.gradle). All three of those
  # levels are exercised, but not all on every commit: this job is the one
  # that gates every validation, and it uses a single well-established
  # level so that a red result here means the APP is broken rather than an
  # emulator image being unavailable. The full 24 / 30 / 34 / 36 sweep -
  # including the lowest supported and the declared target - runs in
  # android-instrumentation-matrix.yml. No level is dropped for failing;
  # they are separated so a flaky image cannot mask a real regression.
  #
  # The app is built x86_64-only because that is the emulator's ABI, and
  # androidTest targets the RELEASE variant (testBuildType in
  # android/app/build.gradle) because the debug variant carries no JS
  # bundle and would fail for want of a Metro server rather than for any
  # product reason. That also makes this the §K evidence that the release
  # package installs and cold-launches, not merely that it assembles.
  # =====================================================================
  android-instrumentation:
    name: Android instrumentation (emulator, API 34)
    runs-on: ubuntu-latest
    needs: [static-validation, jest]
    if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
    # 120, not 90: the release APK and the androidTest APK are now built in
    # their own step ahead of the emulator, and that build compiles Skia,
    # Reanimated and Worklets from C++. This is head-room for work that was
    # always there, not head-room bought to hide a hang - the build step and
    # the emulator step carry their own tighter caps (60 and the action's
    # own boot timeout), so a stuck stage still fails on its own.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The NDK is deliberately NOT removed here, unlike an earlier draft of
      # this job. This job builds the release APK, and that means building
      # Skia, Reanimated and Worklets from C++ - run 226 shows those
      # compiling against ndk/27.1.12297006. Deleting it would have failed
      # the build for a reason that had nothing to do with Android. The list
      # below is the one the android-validation job already uses and proves
      # every run.
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"
          df -h /
          codeql_path="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          for path in /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /opt/az /usr/local/share/powershell /usr/local/share/chromium \
                      "$codeql_path"; do
            if [ -e "$path" ]; then
              echo "  Removing: $path"
              sudo rm -rf -- "$path"
            else
              echo "  Not present: $path"
            fi
          done
          echo "Disk after cleanup:"
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      # Hardware acceleration. GitHub's Linux runners expose /dev/kvm, but
      # only to root by default; without this the emulator silently falls
      # back to software rendering and takes many times longer to boot.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # SUPPLY CHAIN. This is the only third-party action in the repository
      # and it is pinned to an immutable commit, not a tag: a tag can be
      # moved to point at different code, a commit SHA cannot. The action
      # is used because reliably creating, booting and waiting on an AVD is
      # fiddly, and a hand-rolled boot loop is the usual source of emulator
      # flake; nothing about it reaches the shipped APK, since it only runs
      # the connected-test task in CI.
      #
      # a421e438... is v2.38.0, resolved with
      #
      #   git ls-remote https://github.com/reactivecircus/android-emulator-runner.git \
      #     'refs/tags/v2.38.0*'
      #   c9c93e6ba9c4194322e114c40970d5983d9a07cc  refs/tags/v2.38.0
      #   a421e43855164a8197daf9d8d40fe71c6996bb0d  refs/tags/v2.38.0^{}
      #
      # and independently confirmed as the HEAD of a shallow clone at that
      # tag. TWO TRAPS, both of which this repository has now walked into
      # once and neither of which is obvious from a tag listing:
      #
      #   * The first line is the ANNOTATED TAG OBJECT. Actions resolves
      #     `uses: owner/repo@<sha>` against COMMITS, so the `^{}` line -
      #     the peeled commit - is the one to pin.
      #   * `sort -V` on the tag names puts v2.9.0 after v2.38.0. The
      #     previous pin here was v2.9.0 for exactly that reason: an old
      #     release that rejected `ram-size` outright and unconditionally
      #     ran `sudo mkdir $ANDROID_HOME/cmdline-tools`, which fails once
      #     Setup Android SDK has created that directory. v2.38.0 guards it
      #     (`if (!fs.existsSync(cmdlineToolsPath))`, src/sdk-installer.ts).
      # BUILD BEFORE THE EMULATOR, ON PURPOSE.
      #
      # "the APKs did not compile" and "the tests failed" are different
      # findings with different owners, and running the build inside the
      # emulator action's script collapses them into one red step. This
      # step owns the first; the step after it owns the second. It also
      # means an emulator is not held open for the length of a C++ build.
      - name: Build the release APK and the androidTest APK
        working-directory: android
        timeout-minutes: 60
        run: |
          ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest \
            -PreactNativeArchitectures=x86_64 \
            --max-workers=2 \
            --no-daemon \
            --stacktrace \
            --console=plain
          ls -la app/build/outputs/apk/release app/build/outputs/apk/androidTest/release

      - name: Instrumentation tests on API 34
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # No `profile`: a hardware profile is one more name that has to
          # exist in whatever cmdline-tools the runner ships, and none of
          # these tests depend on a particular screen. The default device
          # is enough, and the matrix workflow already used it.
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          # ONE LINE, ON PURPOSE.
          #
          # This used to be a ~45-line inline block, and run 34353419058
          # showed the cost: the action runs its `script` input with
          # /usr/bin/sh, which on the Ubuntu runner is dash, and the block
          # opened with `set -o pipefail`. dash does not have it:
          #
          #   [command]/usr/bin/sh -c set -o pipefail
          #   /usr/bin/sh: 1: set: Illegal option -o pipefail
          #
          # The block died on its first line, after a 17-minute APK build
          # and a 71-second emulator boot, with a healthy emulator and not
          # one test executed. A file with a bash shebang cannot be run by
          # the wrong shell, and it can be exercised locally against a fake
          # adb before it is ever pushed. See the header of
          # scripts/ci/run-instrumentation-on-emulator.sh.
          #
          # The diagnostics are captured whether the run passed or failed,
          # and the gradle status is preserved across that capture, so a
          # failing run still reports as failing AND still leaves evidence.
          script: ../scripts/ci/run-instrumentation-on-emulator.sh

      # Counts the executed tests, prints every suite and every failing
      # case, and scans the captured logcat for a crash or an ANR that a
      # green suite would otherwise hide. A missing results directory is a
      # failure here and is reported as a build/emulator problem rather
      # than as a test problem. See scripts/ci/verify-instrumentation-results.sh.
      - name: Verify instrumentation results
        if: ${{ always() }}
        run: |
          scripts/ci/verify-instrumentation-results.sh \
            android/app/build/outputs/androidTest-results/connected \
            instrumentation-diagnostics/logcat.txt

      - name: Upload instrumentation results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-instrumentation-results
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
            instrumentation-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # THE REST OF THE SUPPORTED RANGE.
  #
  # The job above is the API 34 reference run and goes with every
  # validation. This one covers the ends of the declared range and the
  # 16 KB page size, and it lives HERE - inside a workflow that already
  # exists on the default branch - rather than in a file of its own.
  #
  # That is not a style choice. A separate dispatch-only workflow was
  # tried and GitHub refused it:
  #
  #   POST /repos/.../actions/workflows/android-instrumentation-matrix.yml
  #        /dispatches -> 404 Not Found
  #
  # workflow_dispatch only registers from the DEFAULT BRANCH, so a
  # workflow file that exists solely on a feature branch is invisible to
  # the API no matter which ref is passed. The definition that RUNS,
  # however, is the one on the dispatched ref - which is why every step
  # this branch has added to the job above has been executing. Putting the
  # matrix in this file therefore makes it reachable without merging
  # anything to the default branch to register it.
  #
  # Off by default: three emulator rows are roughly two hours of runner
  # time. `api_matrix: true` on a dispatch turns it on; `[api-matrix]` in
  # a commit message does the same for a push, so the branch has a trigger
  # that does not depend on the input list either.
  #
  # LEVELS, chosen from android/build.gradle's own declaration
  # (minSdkVersion 24, targetSdkVersion 36) rather than by taste:
  #
  #   24  the LOWEST level the app claims. Also the only level where
  #       ProcessTermination's destroyForcibly fallback is the branch that
  #       actually executes - destroyForcibly is API 26.
  #   36  the DECLARED TARGET, where the opt-in behaviour changes apply.
  #   35  a genuine 16 KB page-size image. Every other row runs 4 KB
  #       pages, so no other row is evidence about 16 KB however green.
  #
  # fail-fast is false so one red level cannot hide the others, and each
  # row fails on zero executed tests (verify-instrumentation-results.sh).
  # ---------------------------------------------------------------------
  android-instrumentation-matrix:
    name: Instrumentation API ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: [static-validation, jest]
    if: >-
      ${{ format('{0}', inputs.diagnostic_js_only) != 'true'
          && (format('{0}', inputs.api_matrix) == 'true'
              || contains(github.event.head_commit.message, '[api-matrix]')) }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - api-level: 24
            target: google_apis
            label: 24 - minSdkVersion
          - api-level: 36
            target: google_apis
            label: 36 - declared targetSdkVersion
          # Android's guide names this image "Google APIs Experimental
          # 16 KB Page Size Intel x86_64 Atom System Image", which is the
          # google_apis_experimental tag, and names the check:
          #
          #   "run the following command to verify that it's using a 16 KB
          #    environment: adb shell getconf PAGE_SIZE. The command
          #    should return a value of 16384."
          #
          # expected-page-size turns that from a note into a requirement:
          # the run fails if the image turns out to be a 4 KB one, so this
          # row cannot report success for the property it exists to test.
          - api-level: 35
            target: google_apis_experimental
            label: 35 - 16 KB page size
            expected-page-size: 16384
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The NDK stays: this job builds the release APK, which compiles
      # Skia, Reanimated and Worklets from C++.
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          codeql_path="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          for path in /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /opt/az /usr/local/share/powershell /usr/local/share/chromium \
                      "$codeql_path"; do
            if [ -e "$path" ]; then
              echo "  Removing: $path"
              sudo rm -rf -- "$path"
            else
              echo "  Not present: $path"
            fi
          done
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: android

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # Ahead of the emulator, for the same reason as the reference job: a
      # compile failure and a test failure are different findings.
      - name: Build the release APK and the androidTest APK
        working-directory: android
        timeout-minutes: 60
        run: |
          ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest \
            -PreactNativeArchitectures=x86_64 \
            --max-workers=2 \
            --no-daemon \
            --stacktrace \
            --console=plain

      # Same immutable commit pin as the reference job. See the supply
      # chain note there for how a421e438... was resolved and the two
      # traps that made an earlier pin point at v2.9.0.
      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        # Empty on every 4 KB row, which leaves the page size reported and
        # not asserted. On the 16 KB row it is 16384, and the script exits
        # non-zero if the emulator disagrees.
        env:
          EXPECT_PAGE_SIZE: ${{ matrix.expected-page-size }}
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ../scripts/ci/run-instrumentation-on-emulator.sh

      - name: Verify instrumentation results
        if: ${{ always() }}
        run: |
          scripts/ci/verify-instrumentation-results.sh \
            android/app/build/outputs/androidTest-results/connected \
            instrumentation-diagnostics/logcat.txt

      - name: Upload instrumentation results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-instrumentation-api-${{ matrix.api-level }}-${{ matrix.target }}
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
            instrumentation-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

  android-validation:
    name: Android validation (Pass 1-4)
    runs-on: ubuntu-latest
    # HARD GATE. `needs` requires SUCCESS, and a matrix job succeeds only
    # when every one of its shards does. So a single failing shard - or a
    # shard killed by its own 20-minute timeout - skips this job and the
    # workflow conclusion is failure: no APK is assembled, signed,
    # verified or uploaded. Assembly happens HERE, ONCE, and never inside
    # the matrix.
    needs: [static-validation, jest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Run-30089612606 root cause (evidence-first investigation): the
      # runner entered the native builds with only 7.2GB free (91% full)
      # and the 4-ABI release build ran the disk to zero mid-way through
      # :shopify_react-native-skia:bundleReleaseLocalLintAar (explicit
      # "No space left on device" seconds later on the same filesystem).
      # This deletes ONLY explicitly-listed preinstalled toolchains this
      # workflow never uses - Node comes from setup-node, Java/SDK/NDK/
      # Gradle are installed explicitly by later steps and are untouched.
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk before cleanup:"
          df -h /

          codeql_path="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"

          cleanup_paths=(
            "/usr/share/dotnet"
            "/opt/ghc"
            "/usr/local/.ghcup"
            "/usr/share/swift"
            "/opt/az"
            "/usr/local/share/powershell"
            "/usr/local/share/chromium"
            "$codeql_path"
          )

          echo "Removing unused preinstalled toolchains:"
          for path in "${cleanup_paths[@]}"; do
            if [[ -e "$path" ]]; then
              echo "  Removing: $path"
              sudo rm -rf -- "$path"
            else
              echo "  Not present: $path"
            fi
          done

          echo "Disk after cleanup:"
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # MANDATORY GATE. Builds the real --dev false bundle and fails the
      # workflow if a debug-only token is present, if the motor engine or
      # the Arabic safety copy is MISSING (the single-app merge requires
      # both to ship - their absence is what made every motors label render
      # as a raw i18n key on the hardware-test device), if a positive
      # control is missing, or if the engine boundary has been crossed in
      # source. Placed after dependency installation and before ANY Release
      # APK work, so a defective bundle can never be packaged or published.
      - name: Production bundle and engine-boundary scan
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        run: npm run scan:production-bundle

      - name: Setup JDK 17 (Temurin)
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        uses: android-actions/setup-android@v4
        with:
          # Must exactly match android/build.gradle: compileSdk/targetSdk 36,
          # buildToolsVersion 36.0.0, ndkVersion 27.1.12297006.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Setup Gradle
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: chmod +x ./gradlew

      - name: Java / Gradle wrapper version proof
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: |
          java -version
          javac -version
          ./gradlew --version

      - name: Dependency resolution (debugRuntimeClasspath)
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath

      - name: usb-serial-for-android dependency insight
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: ./gradlew :app:dependencyInsight --dependency usb-serial-for-android --configuration debugRuntimeClasspath

      - name: Compile Kotlin (debug)
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin

      - name: JVM unit tests (debug)
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      # ANDROID LINT, AS A REAL GATE.
      #
      # Until UI-X3 this workflow ran no lint task at all. It only uploaded
      # app/build/reports/lint-results-debug.html with `if-no-files-found:
      # ignore`, so the step went green on a file nothing ever produced -
      # a gate that looked present and checked nothing. `assemble` does not
      # run lint in AGP; at most `assembleRelease` pulls in the fatal-only
      # lintVitalRelease, which is not the same check and writes no report.
      #
      # Both variants are linted, no baseline file is used, and no category
      # is disabled: a finding must be repaired or narrowly suppressed at
      # the source with a written reason, never hidden here.
      #
      # Placed BEFORE the two assemble steps on purpose. Those cost ~45
      # minutes together, and there is no sense paying that to discover a
      # lint error afterwards.
      # The verifier does three things Gradle's own exit code does not:
      # it fails when :app:lintAnalyzeDebug did not actually run, it fails
      # when either report is missing or empty, and it PRINTS EVERY
      # FINDING. Gradle prints only "Lint found N errors and M warnings.
      # First failure: ..." - and artifact storage is unreachable from the
      # environment this repository is audited in, so an unprinted finding
      # is a lost one. See scripts/ci/verify-android-lint.sh.
      - name: Android Lint (debug)
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        timeout-minutes: 25
        run: ../scripts/ci/verify-android-lint.sh debug


      # CI-only mitigation for the run-30086823998 failure (runner died
      # ~26min into the first-ever native build of Skia/Reanimated/Worklets,
      # signature of host resource exhaustion): the DEBUG validation build
      # compiles C++ for arm64-v8a only and caps Gradle at 2 workers, via
      # command-line flags only - android/gradle.properties (and therefore
      # every local/release build) keeps the full 4-ABI configuration.
      # --no-daemon/--stacktrace/--info/--console=plain make any recurrence
      # fail with a readable tail instead of a silent runner death, and
      # timeout-minutes bounds it instead of the 6h default.
      - name: Android build diagnostics
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: |
          echo "Build diagnostics started at: $(date -u)"
          echo "Java:"
          java -version
          echo "Gradle:"
          ./gradlew --version
          echo "Disk:"
          df -h
          echo "Memory:"
          free -h || true

      - name: Assemble debug APK
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        timeout-minutes: 30
        run: |
          ./gradlew :app:assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            --max-workers=2 \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain

      - name: Locate and verify debug APK
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK produced" >&2
            exit 1
          fi
          test -s "$APK_PATH"
          echo "Resolved debug APK (Metro-dependent - needed for __DEV__-only FPV-BATT/FPV-TELEM logs): android/$APK_PATH"
          ls -la "$APK_PATH"
          # The APK FILE's own digest. Deliberately not the same thing as
          # the artifact digest actions/upload-artifact reports, which is
          # the digest of the .zip wrapper around it - only this one can
          # be checked against the file after it is unzipped and
          # installed.
          echo "Debug APK size (bytes): $(stat -c %s "$APK_PATH")"
          echo "Debug APK SHA-256: $(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          echo "DEBUG_APK_PATH=android/$APK_PATH" >> "$GITHUB_ENV"

      # Pass 7.6c - see the workflow header comment: __DEV__-only hardware
      # observability requires the debug variant; this artifact is named
      # and documented so it can never be mistaken for the standalone
      # release APK.
      - name: Upload debug APK artifact (Metro-dependent, for FPV-BATT/FPV-TELEM log capture)
        if: ${{ success() && format('{0}', inputs.diagnostic_js_only) != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-apk-debug
          path: ${{ env.DEBUG_APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Disk before release build
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk before release build:"
          df -h /

          echo "Android build-directory sizes:"
          du -sh \
            android/.gradle \
            android/build \
            android/app/build \
            2>/dev/null || true

      - name: Assemble release APK (standalone, no Metro required)
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Android failure disk diagnostics
        if: ${{ failure() && format('{0}', inputs.diagnostic_js_only) != 'true' }}
        shell: bash
        run: |
          echo "Disk state after failure:"
          df -h / || true

          echo "Largest Android paths after failure:"
          du -xhd 4 android 2>/dev/null \
            | sort -h \
            | tail -40 || true

      # RELEASE LINT, deliberately AFTER assembleRelease.
      #
      # lintRelease analyses the release variant, so run on its own it
      # would first have to produce the release JS bundle and merged
      # assets - the work the assemble step above already measured at
      # ~38 minutes. Ordering it here reuses those outputs instead of
      # paying for them twice, and keeps the debug lint gate early where
      # it can still fail the run cheaply.
      # Same verifier, release variant. `if: always()` is deliberately NOT
      # used: this runs after assembleRelease on purpose (it reuses that
      # ~38 minutes of bundle and asset work instead of paying it twice),
      # so if the release build failed there is nothing here to lint and
      # the earlier failure is the one to read.
      - name: Android Lint (release)
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        timeout-minutes: 30
        run: ../scripts/ci/verify-android-lint.sh release

      - name: Locate and verify standalone release APK
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: |
          RELEASE_APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$RELEASE_APK_PATH" ]; then
            echo "No release APK produced" >&2
            exit 1
          fi
          test -s "$RELEASE_APK_PATH"
          echo "Resolved release APK: android/$RELEASE_APK_PATH"
          ls -la "$RELEASE_APK_PATH"
          # The APK FILE's own digest - see the debug step above for why
          # the artifact digest is not a substitute for it.
          echo "Release APK size (bytes): $(stat -c %s "$RELEASE_APK_PATH")"
          echo "Release APK SHA-256: $(sha256sum "$RELEASE_APK_PATH" | cut -d' ' -f1)"
          echo "RELEASE_APK_PATH=android/$RELEASE_APK_PATH" >> "$GITHUB_ENV"

      - name: Verify standalone release APK is signed
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${RELEASE_APK_PATH#android/}"

      - name: Verify standalone release APK contains the JS bundle
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: |
          BUNDLE_PATH="${RELEASE_APK_PATH#android/}"
          unzip -l "$BUNDLE_PATH" | grep -E 'assets/index\.android\.bundle|assets/.*\.hbc' \
            || { echo "Release APK does not contain a packaged JS bundle" >&2; exit 1; }

      # THE DEBUG-ONLY NATIVE SURFACE MUST NOT BE IN THE RELEASE DEX.
      #
      # android/app/src/{debug,release}/VariantReactPackages.kt exist to
      # keep `com.fpvarbcon.debug` out of every non-debug DEX, and the
      # hardwareTest source set was written to the same rule. Nothing in
      # CI actually proved it - the claim was made and never checked. A DEX
      # carries type descriptors as literal strings ("Lcom/fpvarbcon/debug/…;"),
      # so a raw byte grep over every classes*.dex reads the shipped bytes
      # rather than standing in for them.
      #
      # Reported by count on every run - including zero - alongside the
      # APK's SHA-256, applicationId and versionName.
      - name: Release DEX check - com/fpvarbcon/debug must be absent
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        working-directory: android
        run: |
          set -euo pipefail
          APK="${RELEASE_APK_PATH#android/}"

          echo "APK: $(basename "$APK")"
          echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" \
            | grep -E "^package:" || true

          workdir="$(mktemp -d)"
          unzip -o -q "$APK" 'classes*.dex' -d "$workdir"
          total=0
          for dex in "$workdir"/classes*.dex; do
            count=$(grep -a -o -F 'com/fpvarbcon/debug' "$dex" | wc -l || true)
            echo "  $(basename "$dex"): com/fpvarbcon/debug x$count"
            total=$((total + count))
          done

          for token in UsbAppLogCapture UsbBoundedProcessReader captureAppLog; do
            hits=0
            for dex in "$workdir"/classes*.dex; do
              hits=$((hits + $(grep -a -o -F "$token" "$dex" | wc -l || true)))
            done
            echo "  $token: x$hits"
            total=$((total + hits))
          done

          rm -rf "$workdir"
          echo "TOTAL debug-only occurrences in release DEX: $total"
          if [ "$total" -ne 0 ]; then
            echo "The debug-only native surface leaked into the release DEX." >&2
            exit 1
          fi

      # 16 KB PAGE ALIGNMENT AND ABI COVERAGE.
      #
      # targetSdkVersion is 36, and from Android 15 a device may use a
      # 16 KB memory page. A shared library whose LOAD segments are
      # aligned to the old 4 KB page cannot be mapped there - the loader
      # rejects it and the app fails at startup on real hardware, with
      # nothing wrong in any test that ran on a 4 KB emulator. The APK
      # carries native code this repository does not build (Hermes, Skia,
      # Reanimated, Worklets, the RN runtime), so a prebuilt that was
      # never re-linked is a real possibility and a real finding.
      #
      # The ABI list is checked in the same step because
      # reactNativeArchitectures decides it, and an accidentally narrowed
      # build produces an APK that will not install on half the fleet
      # while every functional test still passes.
      #
      # Proved against real ELF binaries before shipping - see
      # scripts/ci/verify-native-packaging.sh.
      #
      # Two independent 16 KB checks, because passing one says nothing
      # about the other: readelf proves each .so is internally aligned,
      # and `zipalign -c -P 16 -v 4` proves the APK puts them on 16 KB
      # boundaries. The second was missing until now; it is Android's own
      # verification command, and zipalign comes from the build-tools
      # package this job already installs.
      - name: Release native packaging - 16 KB alignment and ABI coverage
        if: ${{ format('{0}', inputs.diagnostic_js_only) != 'true' }}
        run: |
          scripts/ci/verify-native-packaging.sh \
            "${RELEASE_APK_PATH}" \
            armeabi-v7a,arm64-v8a,x86,x86_64

      - name: Upload standalone release APK artifact (the only user-facing download)
        if: ${{ success() && format('{0}', inputs.diagnostic_js_only) != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-apk
          path: ${{ env.RELEASE_APK_PATH }}
          if-no-files-found: error
          retention-days: 14


      - name: Upload JVM unit test reports
        if: ${{ always() && format('{0}', inputs.diagnostic_js_only) != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      # always(), so the reports survive a lint step that failed - that is
      # exactly the run whose findings need reading. `error` rather than
      # `ignore`: the old `ignore` is what let a report that was never
      # generated pass silently for the whole life of this workflow.
      #
      # This upload cannot mask the real failure. If lint failed, its own
      # step already failed the job; a later upload failure only adds to
      # the log, it does not replace the primary error.
      - name: Upload Android lint reports (debug + release)
        if: ${{ always() && format('{0}', inputs.diagnostic_js_only) != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/lint-results-release.xml
          if-no-files-found: error
          retention-days: 14


      # THE FINDINGS, AGAIN, AT THE END.
      #
      # Not cosmetic. GitHub's log API returns only a bounded tail, and in
      # the environment this repository is audited from, artifact storage
      # is not reachable at all - a fetch of the lint artifact fails with
      # "CONNECT tunnel failed, response 403". Run 227 proved the
      # consequence: :app:lintDebug printed all its findings at 10:31, the
      # job ran until 11:34, and by then the debug findings had scrolled
      # out of every retrievable window while the release ones - printed
      # last - were still readable.
      #
      # Reprinting both reports as the final act of the job makes the
      # findings retrievable whatever else the job did. It asserts nothing
      # and gates nothing; the gates are the two lint steps above, which
      # have already run and already failed the job if they should.
      - name: Android Lint findings digest (both variants, printed last)
        if: ${{ always() && format('{0}', inputs.diagnostic_js_only) != 'true' }}
        run: |
          for variant in debug release; do
            report="android/app/build/reports/lint-results-${variant}.xml"
            echo "::group::Android Lint digest - ${variant}"
            if [ -s "$report" ]; then
              python3 scripts/ci/print-lint-findings.py "$report" "$variant" || true
            else
              echo "no report at $report (the lint step for this variant did not reach it)"
            fi
            echo "::endgroup::"
          done