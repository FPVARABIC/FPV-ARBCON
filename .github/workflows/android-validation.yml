name: Android Validation

# Mandatory quality gate for native (Android/Kotlin) passes.
# Proves the repository's own Gradle wrapper actually compiles and tests the
# Pass 1-4 USB serial transport code. Must stay green before any future
# native pass (Pass 5+) is planned or implemented.
#
# Also builds a standalone release APK (signed with the repo's existing,
# non-secret debug keystore - internal validation signing only, not a
# production release) so it can be installed and launched on real hardware
# without a Metro server. The debug variant is still built and exercised
# internally (compileDebugKotlin/testDebugUnitTest/assembleDebug all run
# against it).
#
# Pass 7.6c: the debug APK is NOW ALSO uploaded, as the clearly-separated
# fpv-arbcon-apk-debug artifact. Rationale: the bounded [FPV-BATT]/
# [FPV-TELEM] hardware observability (batteryDebugLog.ts /
# auxTelemetryDebugLog.ts) is deliberately __DEV__-only, so the standalone
# release APK cannot emit it - capturing those logs on real hardware
# requires the debug variant. LIMITATION, disclosed rather than hidden:
# this debug APK does NOT bundle the JS - it needs a Metro server on the
# connected computer (npx react-native start + adb reverse tcp:8081
# tcp:8081). The standalone fpv-arbcon-apk release artifact remains the
# primary hardware-validation download.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/platforms/react-native/**'
      - 'src/core/**'
      - 'src/ui/**'
      - 'src/i18n/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'index.js'
      - '*.config.js'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/android-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/platforms/react-native/**'
      - 'src/core/**'
      - 'src/ui/**'
      - 'src/i18n/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'index.js'
      - '*.config.js'
      - 'tsconfig.json'
      - 'scripts/**'
      - '.github/workflows/android-validation.yml'

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-validation:
    name: Android validation (Pass 1-4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Run-30089612606 root cause (evidence-first investigation): the
      # runner entered the native builds with only 7.2GB free (91% full)
      # and the 4-ABI release build ran the disk to zero mid-way through
      # :shopify_react-native-skia:bundleReleaseLocalLintAar (explicit
      # "No space left on device" seconds later on the same filesystem).
      # This deletes ONLY explicitly-listed preinstalled toolchains this
      # workflow never uses - Node comes from setup-node, Java/SDK/NDK/
      # Gradle are installed explicitly by later steps and are untouched.
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk before cleanup:"
          df -h /

          codeql_path="${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"

          cleanup_paths=(
            "/usr/share/dotnet"
            "/opt/ghc"
            "/usr/local/.ghcup"
            "/usr/share/swift"
            "/opt/az"
            "/usr/local/share/powershell"
            "/usr/local/share/chromium"
            "$codeql_path"
          )

          echo "Removing unused preinstalled toolchains:"
          for path in "${cleanup_paths[@]}"; do
            if [[ -e "$path" ]]; then
              echo "  Removing: $path"
              sudo rm -rf -- "$path"
            else
              echo "  Not present: $path"
            fi
          done

          echo "Disk after cleanup:"
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: TypeScript check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      - name: ESLint
        run: npx eslint .

      - name: Jest
        run: npx jest --ci

      # R2: MANDATORY CONTAINMENT GATE. Builds the real --dev false bundle
      # and fails the workflow if the motor-test engine (or any Pass 7.7
      # debug-panel token) is present, or if a positive control is missing.
      # Placed after dependency installation and before ANY Release APK
      # work, so a contaminated bundle can never be packaged or published.
      - name: Production bundle containment scan
        run: npm run scan:production-bundle

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Must exactly match android/build.gradle: compileSdk/targetSdk 36,
          # buildToolsVersion 36.0.0, ndkVersion 27.1.12297006.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Java / Gradle wrapper version proof
        working-directory: android
        run: |
          java -version
          javac -version
          ./gradlew --version

      - name: Dependency resolution (debugRuntimeClasspath)
        working-directory: android
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath

      - name: usb-serial-for-android dependency insight
        working-directory: android
        run: ./gradlew :app:dependencyInsight --dependency usb-serial-for-android --configuration debugRuntimeClasspath

      - name: Compile Kotlin (debug)
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin

      - name: JVM unit tests (debug)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      # CI-only mitigation for the run-30086823998 failure (runner died
      # ~26min into the first-ever native build of Skia/Reanimated/Worklets,
      # signature of host resource exhaustion): the DEBUG validation build
      # compiles C++ for arm64-v8a only and caps Gradle at 2 workers, via
      # command-line flags only - android/gradle.properties (and therefore
      # every local/release build) keeps the full 4-ABI configuration.
      # --no-daemon/--stacktrace/--info/--console=plain make any recurrence
      # fail with a readable tail instead of a silent runner death, and
      # timeout-minutes bounds it instead of the 6h default.
      - name: Android build diagnostics
        working-directory: android
        run: |
          echo "Build diagnostics started at: $(date -u)"
          echo "Java:"
          java -version
          echo "Gradle:"
          ./gradlew --version
          echo "Disk:"
          df -h
          echo "Memory:"
          free -h || true

      - name: Assemble debug APK
        working-directory: android
        timeout-minutes: 30
        run: |
          ./gradlew :app:assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            --max-workers=2 \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain

      - name: Locate and verify debug APK
        working-directory: android
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK produced" >&2
            exit 1
          fi
          test -s "$APK_PATH"
          echo "Resolved debug APK (Metro-dependent - needed for __DEV__-only FPV-BATT/FPV-TELEM logs): android/$APK_PATH"
          ls -la "$APK_PATH"
          # The APK FILE's own digest. Deliberately not the same thing as
          # the artifact digest actions/upload-artifact reports, which is
          # the digest of the .zip wrapper around it - only this one can
          # be checked against the file after it is unzipped and
          # installed.
          echo "Debug APK size (bytes): $(stat -c %s "$APK_PATH")"
          echo "Debug APK SHA-256: $(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          echo "DEBUG_APK_PATH=android/$APK_PATH" >> "$GITHUB_ENV"

      # Pass 7.6c - see the workflow header comment: __DEV__-only hardware
      # observability requires the debug variant; this artifact is named
      # and documented so it can never be mistaken for the standalone
      # release APK.
      - name: Upload debug APK artifact (Metro-dependent, for FPV-BATT/FPV-TELEM log capture)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-apk-debug
          path: ${{ env.DEBUG_APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Disk before release build
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk before release build:"
          df -h /

          echo "Android build-directory sizes:"
          du -sh \
            android/.gradle \
            android/build \
            android/app/build \
            2>/dev/null || true

      - name: Assemble release APK (standalone, no Metro required)
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Android failure disk diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "Disk state after failure:"
          df -h / || true

          echo "Largest Android paths after failure:"
          du -xhd 4 android 2>/dev/null \
            | sort -h \
            | tail -40 || true

      - name: Locate and verify standalone release APK
        working-directory: android
        run: |
          RELEASE_APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$RELEASE_APK_PATH" ]; then
            echo "No release APK produced" >&2
            exit 1
          fi
          test -s "$RELEASE_APK_PATH"
          echo "Resolved release APK: android/$RELEASE_APK_PATH"
          ls -la "$RELEASE_APK_PATH"
          # The APK FILE's own digest - see the debug step above for why
          # the artifact digest is not a substitute for it.
          echo "Release APK size (bytes): $(stat -c %s "$RELEASE_APK_PATH")"
          echo "Release APK SHA-256: $(sha256sum "$RELEASE_APK_PATH" | cut -d' ' -f1)"
          echo "RELEASE_APK_PATH=android/$RELEASE_APK_PATH" >> "$GITHUB_ENV"

      - name: Verify standalone release APK is signed
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${RELEASE_APK_PATH#android/}"

      - name: Verify standalone release APK contains the JS bundle
        working-directory: android
        run: |
          BUNDLE_PATH="${RELEASE_APK_PATH#android/}"
          unzip -l "$BUNDLE_PATH" | grep -E 'assets/index\.android\.bundle|assets/.*\.hbc' \
            || { echo "Release APK does not contain a packaged JS bundle" >&2; exit 1; }

      # THE DEBUG-ONLY NATIVE SURFACE MUST NOT BE IN THE RELEASE DEX.
      #
      # android/app/src/{debug,release}/VariantReactPackages.kt exist to
      # keep `com.fpvarbcon.debug` out of every non-debug DEX, and the
      # hardwareTest source set was written to the same rule. Nothing in
      # CI actually proved it - the claim was made and never checked. A DEX
      # carries type descriptors as literal strings ("Lcom/fpvarbcon/debug/…;"),
      # so a raw byte grep over every classes*.dex reads the shipped bytes
      # rather than standing in for them.
      #
      # Reported by count on every run - including zero - alongside the
      # APK's SHA-256, applicationId and versionName.
      - name: Release DEX check - com/fpvarbcon/debug must be absent
        working-directory: android
        run: |
          set -euo pipefail
          APK="${RELEASE_APK_PATH#android/}"

          echo "APK: $(basename "$APK")"
          echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" \
            | grep -E "^package:" || true

          workdir="$(mktemp -d)"
          unzip -o -q "$APK" 'classes*.dex' -d "$workdir"
          total=0
          for dex in "$workdir"/classes*.dex; do
            count=$(grep -a -o -F 'com/fpvarbcon/debug' "$dex" | wc -l || true)
            echo "  $(basename "$dex"): com/fpvarbcon/debug x$count"
            total=$((total + count))
          done

          for token in UsbAppLogCapture UsbBoundedProcessReader captureAppLog; do
            hits=0
            for dex in "$workdir"/classes*.dex; do
              hits=$((hits + $(grep -a -o -F "$token" "$dex" | wc -l || true)))
            done
            echo "  $token: x$hits"
            total=$((total + hits))
          done

          rm -rf "$workdir"
          echo "TOTAL debug-only occurrences in release DEX: $total"
          if [ "$total" -ne 0 ]; then
            echo "The debug-only native surface leaked into the release DEX." >&2
            exit 1
          fi

      - name: Upload standalone release APK artifact (the only user-facing download)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-apk
          path: ${{ env.RELEASE_APK_PATH }}
          if-no-files-found: error
          retention-days: 14


      - name: Upload JVM unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fpv-arbcon-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
